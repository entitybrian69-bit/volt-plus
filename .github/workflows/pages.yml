name: Volt Plus Website (GitHub Pages)

on:
  push:
    branches: [android, arena/16c8aaea-volt-plus]
    paths:
      - 'website/**'
      - 'tools/build_pages_site.py'
      - '.github/workflows/pages.yml'
  release:
    types: [published, released, edited]
  workflow_run:
    workflows: ['Volt Plus APK']
    types: [completed]
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false

      - name: Prepare _site with latest Release APKs
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/build_pages_site.py --repo "${{ github.repository }}"

      - name: Avoid racing legacy GitHub Pages branch sync on push
        if: github.event_name == 'push'
        run: sleep 45

      - name: Ensure GitHub Pages uses workflow deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X PUT "repos/${{ github.repository }}/pages" -f build_type=workflow || echo "Note: Set Repo Settings -> Pages -> Source to GitHub Actions"

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Wait for artifact registration
        run: sleep 5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
